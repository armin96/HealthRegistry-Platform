services:
  mysql:
    image: mysql:8.0
    container_name: health_mysql
    restart: always
    command:
      - --innodb-buffer-pool-size=64M
      - --max-connections=40
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: health_password_2026
      MYSQL_DATABASE: health_registry
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - health_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-phealth_password_2026"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7.0
    container_name: health_mongodb
    restart: always
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - mongo_data:/data/db
    networks:
      - health_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./app-node
      dockerfile: Dockerfile
    container_name: health_app
    restart: always
    ports:
      - "3000:3000"
      - "80:3000"
    environment:
      PORT: 3000
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: health_password_2026
      MYSQL_DATABASE: health_registry
      MONGO_URI: mongodb://mongodb:27017/
      MONGO_DB: health_registry
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - health_net

volumes:
  mysql_data:
  mongo_data:

networks:
  health_net:
    driver: bridge
